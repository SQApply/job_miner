browser:
  headless: true
  verbose: false

  remove_overlay_elements: true
  remove_consent_popups: true

  use_persistent_context: false
  user_data_dir: null

  scan_full_page: true
  max_scroll_steps: 20
  scroll_delay: 0.25

  enable_stealth: true
  user_agent_mode: "random"

  delay_before_return_html: 1.0
  listing_wait_for_timeout: 45000
  detail_wait_for_timeout: 15000

  geolocation_enabled: true
  geolocation_latitude: 39.8283
  geolocation_longitude: -98.5795
  geolocation_accuracy: 50000.0

  detail_extraction_concurrency: 3
  
llm:
  provider: "ollama/qwen2.5:3b"
  base_url: "http://127.0.0.1:11434"
  api_token: "ollama"
  temperature: 0.0
  max_tokens: 1400
  chunk_token_threshold: 1400
  overlap_rate: 0.05

output:
  dir: "data/processed"