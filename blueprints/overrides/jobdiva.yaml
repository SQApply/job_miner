listing:
  initial_wait_for: |
    js:() => {
      const visible = (el) => {
        if (!el) return false;
        const style = window.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        return style.display !== 'none' &&
               style.visibility !== 'hidden' &&
               rect.width > 0 &&
               rect.height > 0;
      };

      const buttons = [...document.querySelectorAll('button[type="button"]')].filter(visible);

      const detailButtons = buttons.filter(btn => ((btn.innerText || '').trim() === 'Details'));
      const numericButtons = buttons.filter(btn => /^\d+$/.test((btn.innerText || '').trim()));
      const nextButton = buttons.find(btn => /next page/i.test(btn.getAttribute('aria-label') || ''));

      return detailButtons.length >= 3 && (numericButtons.length >= 2 || !!nextButton);
    }

  detail_capture_mode: "click_buttons"

  detail_button:
    selector: 'button[type="button"]'
    exact_text: "details"
    max_buttons: 100

  detail_wait_for: |
    js:() => {
      const currentBody = (document.body.innerText || '').slice(0, 8000);
      const detailsButtons = [...document.querySelectorAll('button[type="button"]')]
        .filter(btn => ((btn.innerText || '').trim() === 'Details'));

      return (
        location.href !== (window.__jm_prev_url || location.href) ||
        currentBody !== (window.__jm_prev_body_sig || '') ||
        detailsButtons.length === 0
      );
    }

  detail_click_js_template: |
    (() => {
      const idx = __INDEX__;

      const visible = (el) => {
        if (!el) return false;
        const style = window.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        return style.display !== 'none' &&
               style.visibility !== 'hidden' &&
               rect.width > 0 &&
               rect.height > 0;
      };

      const detailButtons = [...document.querySelectorAll('button[type="button"]')]
        .filter(visible)
        .filter(btn => ((btn.innerText || '').trim() === 'Details'));

      const target = detailButtons[idx] || null;

      window.__jm_prev_url = location.href;
      window.__jm_prev_body_sig = (document.body.innerText || '').slice(0, 8000);
      window.__jm_listing_url = location.href;

      if (target) {
        target.scrollIntoView({ behavior: 'instant', block: 'center' });
        target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        target.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
        target.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
        if (typeof target.click === 'function') target.click();
      }
    })();

  back_to_listing_js: |
    (() => {
      const prev = location.href;
      history.back();

      setTimeout(() => {
        if (location.href === prev) {
          location.href = window.__jm_listing_url || location.href;
        }
      }, 900);
    })();

  back_to_listing_wait_for: |
    js:() => {
      const visible = (el) => {
        if (!el) return false;
        const style = window.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        return style.display !== 'none' &&
               style.visibility !== 'hidden' &&
               rect.width > 0 &&
               rect.height > 0;
      };

      const detailButtons = [...document.querySelectorAll('button[type="button"]')]
        .filter(visible)
        .filter(btn => ((btn.innerText || '').trim() === 'Details'));

      return detailButtons.length >= 3;
    }

  pagination:
    click_js_override: |
      (() => {
        const visible = (el) => {
          if (!el) return false;
          const style = window.getComputedStyle(el);
          const rect = el.getBoundingClientRect();
          return style.display !== 'none' &&
                 style.visibility !== 'hidden' &&
                 rect.width > 0 &&
                 rect.height > 0;
        };

        const buttons = [...document.querySelectorAll('button[type="button"]')].filter(visible);

        const numericButtons = buttons.filter(btn => /^\d+$/.test((btn.innerText || '').trim()));
        const current = numericButtons.find(btn => !btn.classList.contains('jd-btn-outline'));

        const currentPage = current ? parseInt((current.innerText || '').trim(), 10) : null;

        const detailButtons = buttons.filter(btn => ((btn.innerText || '').trim() === 'Details'));
        const currentRows = detailButtons.slice(0, 5).map((btn, i) => {
          let node = btn.parentElement;
          for (let k = 0; k < 6 && node; k++) {
            const txt = (node.innerText || '').replace(/\s+/g, ' ').trim();
            if (txt.length > 40) {
              return `${i + 1}: ${txt.slice(0, 180)}`;
            }
            node = node.parentElement;
          }
          return `${i + 1}: NO_TEXT_FOUND`;
        });

        window.__jm_prev_url = location.href;
        window.__jm_prev_current_page = currentPage;
        window.__jm_prev_rows_sig = JSON.stringify(currentRows);

        let target = null;

        if (Number.isFinite(currentPage)) {
          target = numericButtons.find(btn => parseInt((btn.innerText || '').trim(), 10) === currentPage + 1) || null;
        }

        if (!target) {
          target = buttons.find(btn => /next page/i.test(btn.getAttribute('aria-label') || '')) || null;
        }

        window.__jm_clicked_pagination = !!target;

        if (target) {
          target.scrollIntoView({ behavior: 'instant', block: 'center' });
          target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          target.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
          target.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
          if (typeof target.click === 'function') target.click();
        }
      })();

    wait_for_js_override: |
      js:() => {
        const visible = (el) => {
          if (!el) return false;
          const style = window.getComputedStyle(el);
          const rect = el.getBoundingClientRect();
          return style.display !== 'none' &&
                 style.visibility !== 'hidden' &&
                 rect.width > 0 &&
                 rect.height > 0;
        };

        const buttons = [...document.querySelectorAll('button[type="button"]')].filter(visible);

        const numericButtons = buttons.filter(btn => /^\d+$/.test((btn.innerText || '').trim()));
        const current = numericButtons.find(btn => !btn.classList.contains('jd-btn-outline'));
        const currentPage = current ? parseInt((current.innerText || '').trim(), 10) : null;

        const detailButtons = buttons.filter(btn => ((btn.innerText || '').trim() === 'Details'));
        const currentRows = detailButtons.slice(0, 5).map((btn, i) => {
          let node = btn.parentElement;
          for (let k = 0; k < 6 && node; k++) {
            const txt = (node.innerText || '').replace(/\s+/g, ' ').trim();
            if (txt.length > 40) {
              return `${i + 1}: ${txt.slice(0, 180)}`;
            }
            node = node.parentElement;
          }
          return `${i + 1}: NO_TEXT_FOUND`;
        });

        if (window.__jm_clicked_pagination === false) return true;

        return (
          currentPage !== window.__jm_prev_current_page ||
          JSON.stringify(currentRows) !== (window.__jm_prev_rows_sig || '[]') ||
          location.href !== (window.__jm_prev_url || location.href)
        );
      }