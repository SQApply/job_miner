adapter: workday

listing:
  item_href_contains: ""
  detail_text_patterns:
    - "view job"
    - "job details"
    - "apply"
  exclude_exact_urls: []
  initial_wait_for: 'js:() => document.body && document.body.innerText.length > 300'
  session_id: "job_miner_workday_session"

  pagination:
    enabled: true
    type: "url_param"
    page_param: "page"
    start_page: 1
    step: 1
    max_turns: 100
    stop_after_stable_rounds: 2

detail:
  # Workday deployments often render job detail pages without a stable h1.
  # Wait for Workday detail/body content instead of blocking on h1.
  wait_for: "js:() => !!(document.body && document.body.innerText && document.body.innerText.length > 500 && (document.querySelector('[data-automation-id=\"jobPostingHeader\"]') || document.querySelector('[data-automation-id=\"jobPostingDescription\"]') || /apply|job description|locations|time type|job id|capital group/i.test(document.body.innerText)))"
  instruction: |
    Extract exactly one job posting from this page.

    Return only valid JSON.
    Do not return markdown.
    Do not use code fences.
    Do not add explanations.

    Rules:
    - title: exact job title from the page
    - job_url: canonical detail page URL
    - apply_url: apply link if visible, else null
    - company: company name if stated, else null
    - location_text: displayed location text, else null
    - employment_type: displayed type such as Contract, Permanent, Full-time, etc.
    - duration: contract duration if stated
    - compensation_text: pay/rate/salary text if stated
    - posted_date: posting date/freshness exactly as displayed, such as "3 days ago", "Yesterday", or "2026-06-18"; otherwise null
    - summary: concise role summary from the page
    - responsibilities: list of responsibilities found on page
    - required_skills: list of required skills and experience
    - preferred_skills: list of preferred or nice-to-have items
    - job_reference: job id or reference if present

    Use null for missing scalar fields.
    Use [] for missing list fields.
    Never invent values.