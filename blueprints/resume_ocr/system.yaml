ocr:
  backend: "ollama_image"          # glmocr_sdk | ollama_image
  ollama_base_url: "http://127.0.0.1:11434"
  ollama_model: "glm-ocr-optimized"
  glmocr_config_path: "configs/resume_ocr/glm_ocr_ollama.yaml"
  layout_device: "cpu"           # cpu keeps the single GPU free for GLM-OCR generation
  prompt: "Text Recognition:"
  max_pages: 8                    # resumes should rarely exceed this; fail-fast for abuse
  pdf_dpi: 140
  max_image_dimension: 1400
  jpeg_quality: 88
  ocr_concurrency: 1              # keep 1 for one local GPU/Ollama instance
  min_native_text_chars: 1200     # if a PDF has enough embedded text, OCR can be skipped
  prefer_native_pdf_text: true
  request_timeout_seconds: 900

llm:
  provider: "qwen2.5:7b"
  base_url: "http://127.0.0.1:11434"
  temperature: 0.0
  max_tokens: 8192
  num_ctx: 8192
  request_timeout_seconds: 1200

parser:
  enabled: true
  min_markdown_chars: 200

  # Use bounded section/block extraction for every resume. Page count is not a
  # reliable routing signal; this mode works for both compact two-page resumes
  # and dense multi-page resumes.
  extraction_mode: "evidence_span_sectional"

  # Legacy monolithic limit retained for debug fallback only.
  max_markdown_chars_for_extraction: 24000

  # Per-call limits for sectional extraction. The parser processes the whole
  # resume by splitting it into bounded evidence blocks instead of truncating the
  # resume globally.
  max_prompt_chars: 24000
  max_role_block_chars: 6000
  max_project_block_chars: 5000
  max_education_block_chars: 3000
  max_summary_chars: 3000
  max_skills_chars: 5000
  max_llm_retries_per_block: 2
  max_role_bullets_per_prompt: 10
  fail_on_single_block_error: false

  # LLM-based evidence-span discovery. This avoids hardcoding resume formats
  # such as company/date line + title line, title first, tables, DOCX paragraphs,
  # or unusual date wording. The LLM first discovers line ranges and then each
  # bounded range is parsed independently.
  max_window_lines: 80
  window_overlap_lines: 15
  min_span_confidence: 0.55
  max_discovered_experience_spans: 30
  max_discovered_project_spans: 20
  max_discovered_education_spans: 12
  enable_sliding_window_fallback: true
  require_current_title: false
  require_current_company: false

output:
  dir: "data/resumes/processed"
  failed_dir: "data/resumes/failed"
  log_dir: "data/resumes/logs"
